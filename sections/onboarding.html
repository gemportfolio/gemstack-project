<section id="onboarding" class="relative overflow-hidden bg-[var(--bg-section-alt)] px-4 py-20 sm:px-6 lg:py-24">

    <div
        class="pointer-events-none absolute -left-32 top-20 h-72 w-72 rounded-full bg-[var(--color-primary-light)]/10 blur-3xl">
    </div>
    <div
        class="pointer-events-none absolute -bottom-32 -right-20 h-96 w-96 rounded-full bg-[var(--color-accent)]/10 blur-3xl">
    </div>

    <div class="relative mx-auto max-w-2xl">

        <div class="mb-8 text-center" data-aos="fade-up">

            <div
                class="mb-3 inline-flex items-center gap-2 rounded-full border border-[var(--border-color)] bg-white px-4 py-2 text-xs font-semibold uppercase tracking-wider text-[var(--color-primary)]">
                <span class="h-2 w-2 rounded-full bg-[var(--color-accent)]"></span>
                Get Started
            </div>

            <h2 class="text-3xl font-bold leading-tight tracking-tight text-[var(--text-primary)] sm:text-4xl">
                Ready to build your
                <span class="text-[var(--color-primary)]">conversion system?</span>
            </h2>

            <p class="mx-auto mt-3 max-w-xl text-sm leading-6 text-[var(--text-secondary)] sm:text-base">
                Choose a package and send us a few details. We'll take it from there on WhatsApp.
            </p>

        </div>

        <form id="whatsapp-onboarding-form"
            class="rounded-3xl border border-[var(--border-color)] bg-white p-6 shadow-xl sm:p-8" data-aos="fade-up">

            <div class="mb-6">

                <label class="mb-3 block text-xs font-semibold uppercase tracking-wide text-[var(--text-primary)]">
                    Choose your package
                </label>

                <div class="grid gap-3 sm:grid-cols-2">

                    <label class="group cursor-pointer">
                        <input type="radio" name="package" value="Starter" class="peer sr-only" required>

                        <div
                            class="rounded-2xl border border-[var(--border-color)] p-4 transition-all peer-checked:border-[var(--color-primary)] peer-checked:bg-[var(--bg-section-alt)] peer-checked:shadow-sm">

                            <div class="flex items-center justify-between">

                                <span class="font-semibold text-[var(--text-primary)]">
                                    Starter
                                </span>

                                <span
                                    class="package-indicator h-5 w-5 rounded-full border border-[var(--border-color)] transition-all"></span>

                            </div>

                            <p class="mt-1 text-xs leading-5 text-[var(--text-secondary)]">
                                A focused conversion landing page to get started.
                            </p>

                        </div>
                    </label>

                    <label class="group cursor-pointer">
                        <input type="radio" name="package" value="Premium" class="peer sr-only">

                        <div
                            class="rounded-2xl border border-[var(--border-color)] p-4 transition-all peer-checked:border-[var(--color-primary)] peer-checked:bg-[var(--bg-section-alt)] peer-checked:shadow-sm">

                            <div class="flex items-center justify-between">

                                <span class="font-semibold text-[var(--text-primary)]">
                                    Premium
                                </span>

                                <span
                                    class="package-indicator h-5 w-5 rounded-full border border-[var(--border-color)] transition-all"></span>

                            </div>

                            <p class="mt-1 text-xs leading-5 text-[var(--text-secondary)]">
                                A complete conversion system for your brand.
                            </p>

                        </div>
                    </label>

                </div>

            </div>

            <div class="grid gap-4 sm:grid-cols-2">

                <div>
                    <label for="name" class="mb-1.5 block text-xs font-semibold text-[var(--text-primary)]">
                        Full name
                    </label>

                    <input id="name" name="name" type="text"
                        class="w-full rounded-xl border border-[var(--border-color)] bg-[var(--input-bg)] px-4 py-3 text-sm text-[var(--text-primary)] outline-none transition placeholder:text-[var(--text-secondary)]/60 focus:border-[var(--color-primary)] focus:ring-2 focus:ring-[var(--color-primary)]/10"
                        placeholder="Your name" required>
                </div>

                <div>
                    <label for="business" class="mb-1.5 block text-xs font-semibold text-[var(--text-primary)]">
                        Brand / business
                    </label>

                    <input id="business" name="business"
                        class="w-full rounded-xl border border-[var(--border-color)] bg-[var(--input-bg)] px-4 py-3 text-sm text-[var(--text-primary)] outline-none transition placeholder:text-[var(--text-secondary)]/60 focus:border-[var(--color-primary)] focus:ring-2 focus:ring-[var(--color-primary)]/10"
                        placeholder="Your brand">
                </div>

            </div>

            <div class="mt-4">

                <label for="email" class="mb-1.5 block text-xs font-semibold text-[var(--text-primary)]">
                    Email <span class="font-normal text-[var(--text-secondary)]">(optional)</span>
                </label>

                <input id="email" name="email" type="email"
                    class="w-full rounded-xl border border-[var(--border-color)] bg-[var(--input-bg)] px-4 py-3 text-sm text-[var(--text-primary)] outline-none transition placeholder:text-[var(--text-secondary)]/60 focus:border-[var(--color-primary)] focus:ring-2 focus:ring-[var(--color-primary)]/10"
                    placeholder="you@example.com">

            </div>

            <div class="mt-4">

                <label for="whatsapp" class="mb-1.5 block text-xs font-semibold text-[var(--text-primary)]">
                    WhatsApp number
                </label>

                <input id="whatsapp" name="whatsapp" type="tel"
                    class="w-full rounded-xl border border-[var(--border-color)] bg-[var(--input-bg)] px-4 py-3 text-sm text-[var(--text-primary)] outline-none transition placeholder:text-[var(--text-secondary)]/60 focus:border-[var(--color-primary)] focus:ring-2 focus:ring-[var(--color-primary)]/10"
                    placeholder="+234 800 000 0000" required>

            </div>

            <p id="onboarding-error" class="mt-3 hidden text-xs text-red-600"></p>

            <button type="submit"
                class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-[var(--btn-primary-bg)] px-5 py-3.5 text-sm font-semibold text-[var(--btn-primary-text)] transition hover:bg-[var(--btn-primary-hover)]">
                Continue on WhatsApp
                <i class="bi bi-whatsapp"></i>
            </button>

            <p class="mt-3 text-center text-xs leading-5 text-[var(--text-secondary)]">
                We'll share payment details and the next steps directly on WhatsApp.
            </p>

        </form>

    </div>
</section>

<style>
    input[name="package"]:checked+div .package-indicator {
        background: var(--color-primary);
        border-color: var(--color-primary);
        box-shadow: inset 0 0 0 4px white;
    }
</style>
